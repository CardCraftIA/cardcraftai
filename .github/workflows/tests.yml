name: Tests

on:
  push:
    branches:
      - staging
      - 'codex/**'
  pull_request:
    branches:
      - main
      - staging
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check web request limits and language rules
        working-directory: web
        run: npm test
      - name: Build public web app and stage catalog
        working-directory: web
        run: npm run build
      - name: Check catalog route on built server
        working-directory: web
        run: npm run smoke

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python without initializing services
        run: python -m compileall -q -x '(^|/)(tmp|\.git|node_modules)/' .
      - name: Run entire suite without external connections
        run: python -B scripts/run_tests.py
      - name: Check whitespace in changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        shell: bash
        run: |
          base="$PUSH_BASE"
          if [ "$EVENT_NAME" = pull_request ]; then base="$PR_BASE"; fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            # A new branch has no previous remote tip; check its latest commit.
            base=$(git rev-parse HEAD^)
          fi
          git diff --check "$base" HEAD
          git diff --exit-code
