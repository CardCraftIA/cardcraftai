function renderUpgrades(){let specs=[['speed',L.speed,3],['radius',L.radius,3],['life',L.life,4],['recharge',L.recharge,4]];$('upgrades').replaceChildren();for(const [key,label,base] of specs){let cost=base+state[key]*2,b=document.createElement('button');b.textContent=`${label} +${state[key]} → +${state[key]+1}`;let small=document.createElement('small');small.textContent=state[key]>=4?L.limit:`${cost} ${L.cost}`;b.appendChild(small);b.disabled=state[key]>=4||state.shards<cost;b.onclick=()=>{state.shards-=cost;state[key]++;if(key==='life'){state.maxHp++;state.hp=Math.min(state.maxHp,state.hp+2);}renderUpgrades();hud();};$('upgrades').appendChild(b);}}
function startRun(){Object.assign(state,{level:1,score:0,shards:0,hp:5,maxHp:5,speed:0,radius:0,life:0,recharge:0});startLevel();}
function startLevel(){Object.assign(state,{mode:'playing',hp:state.maxHp,kills:0,combo:0,comboTime:0,coreHp:12,time:0,spawnTime:.7,attackCd:0,powerCd:0,hurtCd:0,damageTaken:0,bossDead:false});hero.position.set(0,0,10);hero.rotation.y=0;core.visible=phaseType()===3;stepTime=0;for(const e of enemies)scene.remove(e.group);for(const a of [...shots,...particles])scene.remove(a.mesh);enemies=[];shots=[];particles=[];for(const b of braziers){b.activated=false;b.litUntil=0;b.light.intensity=.3;}if(phaseType()===5){spawnEnemy('boss');playSound(85,.65,'sawtooth');}$('overlay').classList.add('hidden');last=performance.now();hud();}
function complete(){if(state.mode!=='playing')return;state.shards+=4+state.level;state.score+=250+Math.max(0,100-state.time|0)+(state.damageTaken===0?200:0);saveRecords();playSound(660,.25,'triangle');menu(L.victory,`${goal()} · +${4+state.level} ✦ · ${L.upgrade}`,L.next,true);}
function defeat(){if(state.mode!=='playing')return;saveRecords();playSound(110,.6,'sawtooth');menu(L.defeat,`${L.score}: ${state.score} · ${L.stage}: ${state.level}`,L.restart);}
$('menuButton').onclick=()=>{initAudio();if(state.mode==='paused'){state.mode='playing';$('overlay').classList.add('hidden');last=performance.now();hud();}else if(state.mode==='upgrade'){state.level++;startLevel();}else startRun();};
$('pause').onclick=()=>{if(state.mode==='playing'){state.mode='paused';keys.clear();menu(L.paused,goal(),L.resume);state.mode='paused';}else if(state.mode==='paused'){state.mode='playing';$('overlay').classList.add('hidden');last=performance.now();}hud();};
$('sound').onclick=()=>{muted=!muted;if(!muted)initAudio();hud();};$('fullscreen').onclick=async()=>{if(fullscreenFallback){let url=URL.createObjectURL(new Blob(['<!doctype html>'+document.documentElement.outerHTML],{type:'text/html'}));let w=window.open(url,'_blank');if(!w)URL.revokeObjectURL(url);return;}try{if(document.fullscreenElement)await document.exitFullscreen();else await $('shell').requestFullscreen();}catch(e){fullscreenFallback=true;hud();}};document.addEventListener('fullscreenchange',hud);
function initAudio(){if(!audio)try{audio=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}if(audio?.state==='suspended')audio.resume();}
function playSound(freq,duration=.13,wave='sine'){if(muted||!audio)return;let o=audio.createOscillator(),gain=audio.createGain();o.type=wave;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(45,freq*.48),audio.currentTime+duration);gain.gain.setValueAtTime(.06,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(gain).connect(audio.destination);o.start();o.stop(audio.currentTime+duration+.01);}
const permitted=new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','ShiftLeft','ShiftRight','Space','KeyE','KeyF']);window.addEventListener('keydown',e=>{if(!permitted.has(e.code))return;e.preventDefault();keys.add(e.code);if(e.repeat)return;if(state.mode==='playing'){initAudio();if(e.code==='KeyE')special();if(e.code==='KeyF')lightBrazier();}});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>keys.clear());
for(const b of document.querySelectorAll('[data-key]')){let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k);initAudio();if(k==='KeyE')special();if(k==='KeyF')lightBrazier();});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys.delete(k));}
function spawnEnemy(kind){let g=createEnemy(kind),z=phaseType()===3?-27-Math.random()*3:clamp(hero.position.z-13-Math.random()*8,-30,26),x=(Math.random()-.5)*8;g.position.set(x,0,z);scene.add(g);let hp=kind==='boss'?22+state.level*2:kind==='tank'?5+Math.floor(state.level/5):kind==='shooter'?3:2;enemies.push({group:g,kind,hp,maxHp:hp,speed:kind==='swift'?2.9:kind==='tank'?1.05:kind==='boss'?1.25:1.65,shootCd:1.7+Math.random()*2,hit:0,born:state.time,attackCd:0});}
function makeParticle(x,y,z,color,velocity,life=.55){let m=new THREE.Mesh(new THREE.IcosahedronGeometry(.09,0),new THREE.MeshBasicMaterial({color,transparent:true}));m.position.set(x,y,z);scene.add(m);particles.push({mesh:m,v:velocity,life,max:life});}
function burst(position,color=0xffd885,count=12){for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*3;makeParticle(position.x,1+Math.random(),position.z,color,new THREE.Vector3(Math.cos(a)*s,Math.random()*3,Math.sin(a)*s));}}
function projectile(start,target,enemy=false){let m=new THREE.Mesh(new THREE.SphereGeometry(enemy?.18:.21,8,6),new THREE.MeshBasicMaterial({color:enemy?0xb884ff:0xffe3a0}));m.position.copy(start);scene.add(m);let d=target.clone().sub(start).normalize();shots.push({mesh:m,velocity:d.multiplyScalar(enemy?7:18),life:enemy?3:1.1,enemy});}
function attack(){if(state.attackCd>0)return;state.attackCd=Math.max(.19,.46-state.recharge*.055);let target=enemies.filter(e=>e.hp>0).sort((a,b)=>a.group.position.distanceTo(hero.position)-b.group.position.distanceTo(hero.position))[0];let origin=hero.position.clone().add(new THREE.Vector3(0,1.2,-.4));if(target&&target.group.position.distanceTo(hero.position)<13)projectile(origin,target.group.position.clone().add(new THREE.Vector3(0,1,0)));else projectile(origin,origin.clone().add(new THREE.Vector3(Math.sin(hero.rotation.y)*-10,0,-Math.cos(hero.rotation.y)*10)));aura.visible=true;hero.userData.cast=.17;playSound(540,.12,'triangle');}
function special(){if(state.mode!=='playing'||state.powerCd>0)return;state.powerCd=Math.max(3,9-state.recharge*1.25);hero.userData.cast=.65;aura.visible=true;let radius=4.1+state.radius*1.15;burst(hero.position,0xffe29a,30);for(const e of [...enemies])if(e.group.position.distanceTo(hero.position)<radius)damageEnemy(e,3);playSound(730,.4,'sine');hud();}
function lightBrazier(){if(state.mode!=='playing')return;let b=braziers.find(b=>b.group.position.distanceTo(hero.position)<2.7&&!b.activated);if(!b)return;b.activated=true;b.litUntil=state.time+18;b.light.intensity=3;state.hp=Math.min(state.maxHp,state.hp+1);state.shards++;burst(b.group.position,0xffdc81,20);playSound(880,.25,'triangle');hud();}
function damageEnemy(e,amount){if(e.hp<=0)return;e.hp-=amount;e.hit=.2;if(e.hp>0){playSound(190,.08,'sawtooth');return;}burst(e.group.position,e.kind==='tank'?0xa5d481:0xc495e5,e.kind==='boss'?45:14);scene.remove(e.group);enemies=enemies.filter(v=>v!==e);state.kills++;state.combo=state.time-state.comboTime<6?state.combo+1:1;state.comboTime=state.time;state.shards+=e.kind==='boss'?8:e.kind==='tank'?2:1;state.score+=100+Math.min(12,state.combo)*20+(state.time-e.born<3?40:0);if(e.kind==='boss')state.bossDead=true;playSound(440,.23,'triangle');hud();}
function hurt(amount=1){if(state.hurtCd>0||state.mode!=='playing')return;state.hp=Math.max(0,state.hp-amount);state.damageTaken+=amount;state.combo=0;state.hurtCd=1.2;burst(hero.position,0xff738a,9);playSound(120,.2,'sawtooth');hud();if(state.hp<=0)defeat();}
function update(dt){state.time+=dt;state.spawnTime-=dt;state.attackCd=Math.max(0,state.attackCd-dt);state.powerCd=Math.max(0,state.powerCd-dt);state.hurtCd=Math.max(0,state.hurtCd-dt);if(state.combo&&state.time-state.comboTime>6)state.combo=0;
 let dx=Number(keys.has('ArrowRight')||keys.has('KeyD'))-Number(keys.has('ArrowLeft')||keys.has('KeyA')),dz=Number(keys.has('ArrowDown')||keys.has('KeyS'))-Number(keys.has('ArrowUp')||keys.has('KeyW')),moving=!!(dx||dz),running=moving&&(keys.has('ShiftLeft')||keys.has('ShiftRight'));if(moving){let n=Math.hypot(dx,dz),speed=(running?7.1:4.3)+state.speed*.68;hero.position.x=clamp(hero.position.x+dx/n*speed*dt,-4.8,4.8);hero.position.z=clamp(hero.position.z+dz/n*speed*dt,-29,27);hero.rotation.y=Math.atan2(-dx,-dz);stepTime-=dt;if(stepTime<=0){playSound(running?118:92,.035,'triangle');stepTime=running?.23:.37;}}else stepTime=0;if(keys.has('Space'))attack();
 hero.userData.cast=Math.max(0,(hero.userData.cast||0)-dt);aura.visible=hero.userData.cast>0;aura.scale.setScalar(1+(1-hero.userData.cast/.65)*.6);let gait=state.time*(running?17:10);hero.userData.legs.forEach((p,i)=>p.rotation.x=moving?Math.sin(gait+(i%2?Math.PI:0)+(i>1?Math.PI:0))*(running?.58:.34):0);hero.userData.tail.rotation.y=Math.sin(state.time*4)*.17;hero.userData.head.rotation.x=hero.userData.cast>0?-.2:0;hero.position.y=0;
 for(const b of braziers){let active=b.litUntil>state.time;b.light.intensity=active?2.4+Math.sin(state.time*8)*.4:.3;b.flame.scale.y=active?1.2+Math.sin(state.time*9)*.1:.45;}
 if(state.spawnTime<=0&&enemies.length<11){if(phaseType()===5&&state.time<3)state.spawnTime=3;else{let roll=Math.random(),kind=state.level>=3&&roll>.77?'shooter':state.level>=2&&roll>.47?'tank':'swift';spawnEnemy(kind);state.spawnTime=Math.max(.9,2.8-state.level*.12);}}
 for(const e of [...enemies]){let target=phaseType()===3?core.position:hero.position,delta=target.clone().sub(e.group.position);delta.y=0;let dist=delta.length(),closeToHero=e.group.position.distanceTo(hero.position);e.hit=Math.max(0,e.hit-dt);e.attackCd=Math.max(0,e.attackCd-dt);e.shootCd-=dt;if(e.kind==='shooter'||e.kind==='boss'){if(e.shootCd<=0&&closeToHero<18){projectile(e.group.position.clone().add(new THREE.Vector3(0,1.4,0)),hero.position.clone().add(new THREE.Vector3(0,1,0)),true);e.shootCd=e.kind==='boss'?1.5:2.5;}}
 if(dist>(e.kind==='shooter'?7:1.1)){delta.normalize();e.group.position.addScaledVector(delta,e.speed*dt);e.group.rotation.y=Math.atan2(-delta.x,-delta.z);}let limbs=e.group.userData.legs;limbs.forEach((p,i)=>p.rotation.x=Math.sin(state.time*(e.kind==='swift'?13:6)+i*Math.PI)*.28);if(closeToHero<(e.kind==='boss'?2.2:1.1)&&e.attackCd<=0){hurt();e.attackCd=1.4;}if(phaseType()===3&&dist<1.6&&e.attackCd<=0){state.coreHp=Math.max(0,state.coreHp-1);e.attackCd=1.3;if(state.coreHp<=0)defeat();}}
 for(const s of [...shots]){s.mesh.position.addScaledVector(s.velocity,dt);s.life-=dt;if(s.enemy){if(s.mesh.position.distanceTo(hero.position.clone().add(new THREE.Vector3(0,1,0)))<.9){hurt();s.life=0;}}else{let hit=enemies.find(e=>e.group.position.distanceTo(s.mesh.position)<(e.kind==='boss'?1.7:1.1)&&Math.abs(s.mesh.position.y-1)<1.5);if(hit){damageEnemy(hit,1);s.life=0;}}if(s.life<=0){scene.remove(s.mesh);shots=shots.filter(v=>v!==s);}}
 for(const p of [...particles]){p.life-=dt;p.mesh.position.addScaledVector(p.v,dt);p.v.y-=5*dt;p.mesh.material.opacity=Math.max(0,p.life/p.max);if(p.life<=0){scene.remove(p.mesh);particles=particles.filter(v=>v!==p);}}
 if(phaseType()===1&&state.kills>=12||phaseType()===2&&state.time>=60||phaseType()===3&&state.time>=75&&state.coreHp>0||phaseType()===4&&state.kills>=10&&braziers.every(b=>b.activated)||phaseType()===5&&state.bossDead)complete();
 musicTime-=dt;if(musicTime<=0){let near=enemies.some(e=>e.group.position.distanceTo(hero.position)<5);musicTime=near?.43:.95;playSound(near?155:110,.06,'sine');}hud();}
function render(now){requestAnimationFrame(render);let dt=Math.min(.05,(now-last)/1000||0);last=now;if(state.mode==='playing')update(dt);let desired=new THREE.Vector3(hero.position.x*.62,5.1,hero.position.z+9.8);camera.position.lerp(desired,.08);camera.lookAt(hero.position.x*.55,1.1,hero.position.z-4);sun.position.set(hero.position.x-13,21,hero.position.z-22);sun.target.position.set(hero.position.x,0,hero.position.z-3);sun.target.updateMatrixWorld();coreOrb.rotation.y+=dt*.7;renderer.render(scene,camera);}
function resize(){let rect=$('view').getBoundingClientRect();renderer.setSize(Math.max(1,rect.width),Math.max(1,rect.height),false);camera.aspect=rect.width/Math.max(1,rect.height);camera.updateProjectionMatrix();}new ResizeObserver(resize).observe($('view'));resize();menu('Nacarim 3D',L.intro,L.start);requestAnimationFrame(render);
}}
</script></body></html>
